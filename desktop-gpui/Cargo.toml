[package]
name = "hoffle-lite"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "unstable-locales"] }
dirs = "7.0.0"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
image = "0.25"
livekit = { version = "0.10.1", features = ["rustls-tls-webpki-roots"] }
resvg = "0.45.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smol = "2.0.2"
sys-locale = "0.3.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros"] }
ttf-parser = "0.25"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
unicode-segmentation = "1.13.3"
# Reading remote video frames (src/voice.rs); both already come with livekit.
futures-util = "0.3"
smallvec = "1"
ureq = { version = "3.5.2", features = ["json"] }
url = "2.5.8"
qrcodegen = "1.8.0"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
# Dock badge, notifications and the menu-bar item (src/desktop.rs); both already come with gpui.
cocoa = "0.26"
objc = "0.2.7"
block = "0.1.6"

[profile.dev]
debug = 0
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.release]
debug = 0
strip = true
lto = "thin"
