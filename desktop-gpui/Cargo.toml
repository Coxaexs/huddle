[package]
name = "hoffle-lite"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
livekit = { version = "0.10.1", features = ["rustls-tls-webpki-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smol = "2.0.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros"] }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
unicode-segmentation = "1.13.3"
ureq = { version = "3.5.2", features = ["json"] }
url = "2.5.8"

[profile.dev]
debug = 0
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.release]
debug = 0
strip = true
lto = "thin"
