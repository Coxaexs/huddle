<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huddle</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #16131f; color: #e8e3f5; text-align: center; }
    button { margin-top: 16px; padding: 10px 20px; border: 0; border-radius: 10px; background: #a78bfa; color: #16131f; font-weight: 700; font-size: 15px; }
  </style>
</head>
<body>
  <!-- Only shown when chat.hoffle.online can't be reached (no connection). -->
  <main>
    <h1>Can't reach Huddle</h1>
    <p>Check your connection and try again.</p>
    <button onclick="location.href='https://chat.hoffle.online/'">Retry</button>
  </main>
</body>
</html>
