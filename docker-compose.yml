# Hoffle, self-hosted.
#
#   docker compose up -d                 start Hoffle (web app, music bot, D&D bot)
#   docker compose logs hoffle           shows the URL and your first-account setup code
#
# No configuration is needed for a first run. To change settings, copy
# .env.example to .env, edit it, and run `docker compose up -d` again.
#
# Optional extras, enabled with profiles (see docs/self-hosting.md):
#   --profile livekit   LiveKit media server for larger voice rooms
#   --profile turn      coturn relay for friends behind strict NATs
#   --profile bridge    Discord <-> Hoffle message bridge

services:
  # Web app, API and realtime server. Data lives in ./state.
  hoffle:
    build:
      context: .
      dockerfile: Dockerfile
    image: hoffle:local
    container_name: hoffle
    restart: unless-stopped
    ports:
      - "${HOFFLE_PORT:-8730}:8730"
    volumes:
      - ./state:/app/state
    env_file:
      - path: .env
        required: false
    environment:
      HOFFLE_PORT: ${HOFFLE_PORT:-8730}
      MUSIC_HELPER_BASE_URL: http://music-bot:8731
      DND_BASE_URL: http://dnd-bot:8732
    depends_on:
      - music-bot
      - dnd-bot

  # Resolves songs with yt-dlp for the built-in music bot. Internal only.
  music-bot:
    build:
      context: ./services/music-bot
    image: hoffle-music-bot:local
    container_name: hoffle-music-bot
    restart: unless-stopped
    expose:
      - "8731"

  # D&D 5e SRD compendium used by the D&D companion bot. Internal only.
  dnd-bot:
    build:
      context: ./services/dnd-bot
    image: hoffle-dnd-bot:local
    container_name: hoffle-dnd-bot
    restart: unless-stopped
    expose:
      - "8732"

  # --- Optional services ----------------------------------------------------

  # Discord bridge. Needs discord-bridge/.env (see discord-bridge/.env.example).
  discord-bridge:
    profiles: [bridge]
    build:
      context: ./discord-bridge
    image: hoffle-discord-bridge:local
    container_name: hoffle-discord-bridge
    restart: unless-stopped
    env_file:
      - path: ./discord-bridge/.env
        required: false
    environment:
      HUDDLE_URL: http://hoffle:8730
      HUDDLE_BASE_PATH: ${BASE_PATH:-/hangout}
    depends_on:
      - hoffle

  # LiveKit SFU. Voice works peer-to-peer without it; add it for big rooms.
  # Change the key in livekit.yaml and set LIVEKIT_* in .env before enabling.
  livekit:
    profiles: [livekit]
    image: livekit/livekit-server:latest
    container_name: hoffle-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"       # signaling (put this behind HTTPS as wss://)
      - "7881:7881"       # WebRTC over TCP
      - "7882:7882/udp"   # WebRTC over UDP
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  # STUN/TURN relay for people whose network blocks peer-to-peer voice.
  # Change the password in deploy/coturn/turnserver.conf before enabling.
  coturn:
    profiles: [turn]
    image: coturn/coturn:latest
    container_name: hoffle-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-49200:49152-49200/udp"
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
