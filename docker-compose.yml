services:
  # ==========================================
  # Hoffle Core: Web App & Realtime Worker
  # ==========================================
  hoffle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hoffle
    restart: unless-stopped
    ports:
      - "8730:8730" # Hoffle Web App & Realtime WebSocket
    volumes:
      - ./state:/app/state
      - ./.dev.vars:/app/.dev.vars:ro
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8730
      - MUSIC_HELPER_BASE_URL=http://music-bot:8731
      - DND_BASE_URL=http://dnd-bot:8732
    depends_on:
      music-bot:
        condition: service_started
      dnd-bot:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8730/hangout/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # Music Bot: Dedicated yt-dlp Audio Resolver
  # ==========================================
  music-bot:
    build:
      context: ./services/music-bot
      dockerfile: Dockerfile
    container_name: hoffle-music-bot
    restart: unless-stopped
    # Port NOT exposed to host — music-bot is only reachable via internal Docker network
    # The main hoffle container calls it at http://music-bot:8731
    expose:
      - "8731"
    environment:
      - PORT=8731

  # ==========================================
  # D&D Bot: 5e SRD Compendium & Companion
  # ==========================================
  dnd-bot:
    build:
      context: ./services/dnd-bot
      dockerfile: Dockerfile
    container_name: hoffle-dnd-bot
    restart: unless-stopped
    # Port NOT exposed to host — dnd-bot is only reachable via internal Docker network
    # The main hoffle container calls it at http://dnd-bot:8732
    expose:
      - "8732"
    environment:
      - PORT=8732

  # ==========================================
  # Discord Bridge: Bidirectional Hoffle <-> Discord Sync
  # ==========================================
  discord-bridge:
    build:
      context: ./discord-bridge
      dockerfile: Dockerfile
    container_name: hoffle-discord-bridge
    restart: unless-stopped
    env_file:
      - ./discord-bridge/.env
    environment:
      - HUDDLE_URL=http://hoffle:8730
      - HUDDLE_BASE_PATH=/hangout
    depends_on:
      - hoffle
    profiles:
      - bridge
      - all

  # ==========================================
  # LiveKit SFU: Discord-grade Voice Relay
  # ==========================================
  livekit:
    image: livekit/livekit-server:latest
    container_name: hoffle-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"         # Signaling & HTTP API
      - "7881:7881"         # WebRTC ICE over TCP fallback
      - "7882:7882/udp"     # WebRTC UDP media
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  # ==========================================
  # Optional Coturn: STUN/TURN Relay for CGNAT / Strict Firewalls
  # Start with: docker compose --profile turn up -d
  # ==========================================
  coturn:
    image: coturn/coturn:latest
    container_name: hoffle-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-49200:49152-49200/udp"
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    profiles:
      - turn
      - all

