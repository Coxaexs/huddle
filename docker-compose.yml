# Hoffle, self-hosted.
#
#   docker compose up -d                 start Hoffle (web app, music bot, D&D bot)
#   docker compose logs hoffle           shows the URL and your first-account setup code
#
# No configuration is needed for a first run. To change settings, copy
# .env.example to .env, edit it, and run `docker compose up -d` again.
#
# Optional extras, enabled with profiles (see docs/self-hosting.md):
#   --profile turn      coturn relay for friends behind strict NATs
#   --profile musicbot  the full Music + Watch bot (dashboard, DJ booth,
#                       lyrics, Watch Together, optional Discord)
#   --profile bridge    Discord <-> Hoffle message bridge

services:
  # Web app, API and realtime server. Data lives in ./state.
  hoffle:
    build:
      context: .
      dockerfile: Dockerfile
    image: hoffle:local
    container_name: hoffle
    restart: unless-stopped
    ports:
      - "${HOFFLE_PORT:-8730}:8730"
    volumes:
      - ./state:/app/state
    env_file:
      - path: .env
        required: false
    environment:
      HOFFLE_PORT: ${HOFFLE_PORT:-8730}
      MUSIC_HELPER_BASE_URL: http://music-bot:8731
      DND_BASE_URL: http://dnd-bot:8732
      # The Music + Watch bot (--profile musicbot). Without the profile the
      # sidebar just shows it as offline.
      MUSICWATCH_BASE_URL: ${MUSICWATCH_BASE_URL:-http://musicwatch:8722}
      # Where browsers reach its dashboard and Watch Together rooms: your
      # Hoffle address, with /musicbot/ and /watch/ proxied to port 8722
      # (see docs/self-hosting.md#music-bot).
      MUSICWATCH_PUBLIC_URL: ${MUSICWATCH_PUBLIC_URL:-http://localhost:${HOFFLE_PORT:-8730}}
    depends_on:
      - music-bot
      - dnd-bot

  # Resolves songs with yt-dlp for the built-in music bot. Internal only.
  music-bot:
    build:
      context: ./services/music-bot
    image: hoffle-music-bot:local
    container_name: hoffle-music-bot
    restart: unless-stopped
    expose:
      - "8731"
    # Optional: YouTube cookies for age-restricted videos. Export a
    # Netscape cookies.txt from a logged-in browser to ./state/youtube-cookies.txt.
    # environment:
    #   YTDLP_COOKIES: /cookies/youtube-cookies.txt
    # volumes:
    #   - ./state/youtube-cookies.txt:/cookies/youtube-cookies.txt:ro

  # D&D 5e SRD compendium used by the D&D companion bot. Internal only.
  dnd-bot:
    build:
      context: ./services/dnd-bot
    image: hoffle-dnd-bot:local
    container_name: hoffle-dnd-bot
    restart: unless-stopped
    expose:
      - "8732"

  # --- Optional services ----------------------------------------------------

  # The full music bot from github.com/Coxaexs/musicwatchtogether: dashboard,
  # DJ booth, lyrics and Watch Together, playing in Hoffle voice rooms. Set
  # DISCORD_TOKEN in .env and the same bot also plays in Discord. It reads
  # Hoffle's generated secrets from ./state/secrets.env, so start Hoffle first.
  musicwatch:
    profiles: [musicbot]
    build:
      context: ./services/musicwatch
      args:
        MUSICBOT_REF: ${MUSICBOT_REF:-main}
    image: hoffle-musicwatch:local
    container_name: hoffle-musicwatch
    restart: unless-stopped
    ports:
      - "127.0.0.1:8722:8722"   # for your reverse proxy only
    volumes:
      - ./state/musicwatch:/data
      # Read-only, for secrets.env. The whole folder rather than the file, so
      # the very first start cannot race Hoffle into creating the file.
      - ./state:/hoffle:ro
    env_file:
      - path: .env
        required: false
    environment:
      HUDDLE_BASE_URL: http://hoffle:8730${BASE_PATH:-/hangout}
      MUSIC_HELPER_URL: http://music-bot:8731
      WEB_SERVER_URL: ${MUSICWATCH_PUBLIC_URL:-http://localhost:8722}
    depends_on:
      - hoffle
      - music-bot

  # Discord bridge. Needs discord-bridge/.env (see discord-bridge/.env.example).
  discord-bridge:
    profiles: [bridge]
    build:
      context: ./discord-bridge
    image: hoffle-discord-bridge:local
    container_name: hoffle-discord-bridge
    restart: unless-stopped
    env_file:
      - path: ./discord-bridge/.env
        required: false
    environment:
      HUDDLE_URL: http://hoffle:8730
      HUDDLE_BASE_PATH: ${BASE_PATH:-/hangout}
    depends_on:
      - hoffle

  # LiveKit SFU, always on. Hoffle generates its key into state/livekit.yaml on
  # start. Browsers use it once LIVEKIT_URL is set in .env; until then voice
  # stays peer-to-peer.
  livekit:
    image: livekit/livekit-server:latest
    container_name: hoffle-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"       # signaling (put this behind HTTPS as wss://)
      - "7881:7881"       # WebRTC over TCP
      - "7882:7882/udp"   # WebRTC over UDP
    volumes:
      - ./state/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      hoffle:
        condition: service_healthy

  # STUN/TURN relay for people whose network blocks peer-to-peer voice.
  # Change the password in deploy/coturn/turnserver.conf before enabling, and
  # set external-ip there to this machine's <public ip>/<private ip> — a relay
  # that advertises the wrong address is silent, see `npm run check:turn`.
  # With host networking coturn can see the LAN address directly, which is what
  # external-ip's private half has to match.
  coturn:
    profiles: [turn]
    image: coturn/coturn:latest
    container_name: hoffle-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    # Host networking publishes nothing itself: coturn opens 3478/udp+tcp,
    # 5349/tcp and the relay range on the machine's own interfaces, so those are
    # the ports to forward at the router.
