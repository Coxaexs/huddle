name: Verify

# Type-checking and the unit suite. Everything else in CI builds or publishes;
# this is the only workflow that can actually fail on a broken change, so it
# runs on every push and PR. `deploy.yml` calls it via `workflow_call` and
# refuses to deploy unless it passes.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`, so CI tests the lockfile that ships.
      - name: Install dependencies
        run: npm ci

      # The build (`vinext build`) strips types instead of checking them, so
      # without this step a type error only shows up at runtime.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
