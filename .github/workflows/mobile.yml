name: Mobile apps

# Builds the Capacitor apps in mobile/. Android: a signed .aab for the Play
# Store and a signed .apk to install directly. iOS: an unsigned .ipa to
# sideload with AltStore / Sideloadly (they re-sign it with your Apple ID).
# Nothing is published anywhere; grab the files from the run's artifacts.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      # Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. See mobile/README.md.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/huddle.jks"
            echo "HUDDLE_KEYSTORE_PATH=$RUNNER_TEMP/huddle.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; release builds will be unsigned."
          fi

      - name: Build
        working-directory: mobile/android
        env:
          HUDDLE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HUDDLE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HUDDLE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          HUDDLE_VERSION_CODE: ${{ github.run_number }}
          HUDDLE_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: huddle-android
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build (unsigned)
        working-directory: mobile/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        working-directory: mobile/ios/App
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Huddle.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: huddle-ios
          path: mobile/ios/App/Huddle.ipa
