name: Build desktop apps

# Manually trigger, or on a version tag like `desktop-v1.0.0`.
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write # to publish the GitHub Release the website links to
  actions: read # SignPath fetches the unsigned build from this run

# Signing, when its secrets are set (docs/code-signing.md says how to get them):
#   Windows  SIGNPATH_API_TOKEN (secret) + SIGNPATH_ORGANIZATION_ID (variable):
#            SignPath Foundation's free certificate for open-source projects.
#   macOS    MAC_CSC_LINK + MAC_CSC_KEY_PASSWORD (the Developer ID .p12, base64)
#            and APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID to notarize.
# Without them the builds come out unsigned (Mac: ad-hoc), as before.
#
# Self-updates: the apps read the newest Release. The Electron app reads the
# latest*.yml files electron-builder writes beside the installers
# (desktop/src/updater.js). Hoffle Lite reads lite-latest.json (written by the
# last job here), whose files are signed with TAURI_SIGNING_PRIVATE_KEY +
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (secrets); the public half is in
# desktop-tauri/src-tauri/tauri.conf.json. Without the private key no Lite
# update can ever install, so keep a copy of it.
env:
  SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
  MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}

jobs:
  build:
    strategy:
      # One platform failing should not cancel the others' builds.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # dist:win compiles native/app-audio.cpp (per-app screen-share audio)
      # with Zig before packaging; dist:mac builds native/app-audio-mac.m with
      # the runner's clang.
      - if: matrix.os == 'windows-latest'
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      # npmRebuild is off in package.json: uiohook-napi (global push-to-talk)
      # ships N-API prebuilds for every platform, and rebuilding it from
      # source needs toolchains the runners lack (distutils, Visual Studio).
      - if: matrix.os != 'macos-latest' || env.MAC_CSC_LINK == ''
        run: npm run ${{ matrix.script }}
      # Developer ID signing and notarization; electron-builder reads these.
      - if: matrix.os == 'macos-latest' && env.MAC_CSC_LINK != ''
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node native/build.js mac
          npx electron-builder --mac --publish never -c.mac.hardenedRuntime=true -c.mac.notarize=true
      # SignPath signs the Windows installer; the signed copy replaces it.
      - if: matrix.os == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        id: unsigned-win
        uses: actions/upload-artifact@v4
        with:
          name: hoffle-windows-unsigned
          path: desktop/dist/*.exe
      - if: matrix.os == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: hoffle
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned-win.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: desktop/dist
      # The signed installer no longer matches the checksum in latest.yml.
      - if: matrix.os == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        run: node scripts/refresh-update-info.mjs dist/latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: hoffle-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/latest*.yml
            desktop/dist/*.blockmap
          if-no-files-found: ignore
      # Tag pushes publish a Release; hoffle.online links to releases/latest,
      # and the installed apps update from it (latest*.yml, blockmaps for
      # downloading only what changed).
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/latest*.yml
            desktop/dist/*.blockmap
          fail_on_unmatched_files: false

  # Lightweight Windows build on WebView2 (desktop-tauri/), attached to the
  # same Release as the Electron installers.
  tauri-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri
      - run: npm install
      # The per-app screen-share audio helper ships inside Lite too
      # (tauri.windows.conf.json), built by Zig like the Electron one.
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: node ../desktop/native/build.js win
      # Also signs the installer for self-updates (the .sig beside it).
      - run: npx tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - id: lite-win
        uses: actions/upload-artifact@v4
        with:
          name: hoffle-lite-windows
          path: desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
      - if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: hoffle
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.lite-win.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: desktop-tauri/src-tauri/target/release/bundle/nsis
      # SignPath changed the installer, so its update signature is signed again.
      - if: env.SIGNPATH_API_TOKEN != ''
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for exe in src-tauri/target/release/bundle/nsis/*.exe; do
            rm -f "$exe.sig"
            npx tauri signer sign "$exe"
          done
      # The update signature, for lite-update-manifest.
      - uses: actions/upload-artifact@v4
        with:
          name: hoffle-lite-update-windows
          path: desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe.sig
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe

  # Lightweight Mac build on the system WebKit (desktop-tauri/): one universal
  # (Apple silicon + Intel) disk image, attached to the same Release. Unsigned,
  # like the Electron builds; macOS asks you to allow it on first open.
  tauri-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri
      - run: npm install
      # "app" too: the self-update is the zipped .app (with its .sig), which
      # gets a name without spaces so its Release URL is predictable.
      - run: npx tauri build --target universal-apple-darwin --bundles app,dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Name the update
        run: |
          v=$(node -p "require('./package.json').version")
          mkdir -p update
          cp "src-tauri/target/universal-apple-darwin/release/bundle/macos/Hoffle Lite.app.tar.gz" "update/Hoffle-Lite-$v-mac-universal.app.tar.gz"
          cp "src-tauri/target/universal-apple-darwin/release/bundle/macos/Hoffle Lite.app.tar.gz.sig" "update/Hoffle-Lite-$v-mac-universal.app.tar.gz.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: hoffle-lite-mac
          path: desktop-tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: hoffle-lite-update-mac
          path: desktop-tauri/update/*.sig
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            desktop-tauri/update/*.app.tar.gz

  # Native apps (desktop-native-*/): no Electron, no Tauri, just the system
  # webview, attached to the same Release. Files carry the desktop version.
  native-windows:
    # Zig cross-compiles the WebView2 app, so a Linux runner is enough.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: bash desktop-native-windows/scripts/build.sh
      - name: Name the file
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          mkdir -p out
          cp desktop-native-windows/build/hoffle_native_windows.zip "out/Hoffle-Native-$v-windows-x64.zip"
      # Its line in native-latest.txt (native-update-manifest).
      - run: |
          mkdir -p native-update
          cd out && f=$(ls Hoffle-Native-*-windows-x64.zip) && echo "windows-x64 $f $(sha256sum "$f" | cut -d' ' -f1)" > ../native-update/windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-update-windows
          path: native-update/windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hoffle-native-windows
          path: out/*
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

  native-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ pkg-config libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libkeybinder-3.0-dev libnotify-dev
      - run: bash desktop-native-linux/scripts/build.sh
      - name: Name the file
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          mkdir -p out
          cp desktop-native-linux/build/hoffle_native_linux_x86_64.tar.gz "out/Hoffle-Native-$v-linux-x86_64.tar.gz"
      - run: |
          mkdir -p native-update
          cd out && f=$(ls Hoffle-Native-*-linux-x86_64.tar.gz) && echo "linux-x86_64 $f $(sha256sum "$f" | cut -d' ' -f1)" > ../native-update/linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-update-linux
          path: native-update/linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hoffle-native-linux
          path: out/*
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

  # Apple Silicon only. Ad-hoc signed like the Electron builds, so macOS asks
  # to allow it on first open instead of calling it damaged.
  native-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash desktop-native-macos/scripts/build.sh
      - run: codesign --force --deep --sign - desktop-native-macos/build/Hoffle.app
      - run: bash desktop-native-macos/scripts/create-dmg.sh
      - name: Name the file
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          mkdir -p out
          cp desktop-native-macos/build/Hoffle-macOS-arm64.dmg "out/Hoffle-Native-$v-mac-arm64.dmg"
          # The self-update replaces the signed .app itself.
          tar -czf "out/Hoffle-Native-$v-mac-arm64.app.tar.gz" -C desktop-native-macos/build Hoffle.app
      - run: |
          mkdir -p native-update
          cd out && f=$(ls Hoffle-Native-*-mac-arm64.app.tar.gz) && echo "mac-arm64 $f $(shasum -a 256 "$f" | cut -d' ' -f1)" > ../native-update/mac.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-update-mac
          path: native-update/mac.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hoffle-native-mac
          path: out/*
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

  # Hoffle Lite's update manifest (src-tauri/src/updater.rs reads it from the
  # latest Release): each platform's file in this Release and its signature.
  lite-update-manifest:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [tauri-windows, tauri-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hoffle-lite-update-*
          path: lite-update
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node desktop-tauri/scripts/update-manifest.mjs "$GITHUB_REF_NAME" lite-update > lite-latest.json
      - run: cat lite-latest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: lite-latest.json

  # Hoffle Native's update list, which desktop/native/native-update.sh and .ps1
  # read from the latest Release: the version, then each platform's file in
  # this Release with its SHA-256.
  native-update-manifest:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [native-windows, native-linux, native-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-update-*
          path: native-update
          merge-multiple: true
      - name: Write native-latest.txt
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          {
            echo "version $v"
            cat native-update/*.txt | awk -v base="$base" '{ print $1, base "/" $2, $3 }'
          } > native-latest.txt
          cat native-latest.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: native-latest.txt

  # Tells hoffle.online whether this release is signed (lib/downloads.ts reads
  # SIGNING.json), so the "Windows protected your PC" note goes away by itself.
  signing-report:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, tauri-windows]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "{\"windows\": ${{ env.SIGNPATH_API_TOKEN != '' }}, \"mac\": ${{ env.MAC_CSC_LINK != '' }}}" > SIGNING.json
          cat SIGNING.json
      - uses: softprops/action-gh-release@v2
        with:
          files: SIGNING.json
