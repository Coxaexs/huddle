name: Build desktop apps

# Manually trigger, or on a version tag like `desktop-v1.0.0`.
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write # to publish the GitHub Release the website links to

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Unsigned builds. To sign/notarize, add CSC_LINK / CSC_KEY_PASSWORD
      # (and APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID for mac)
      # as repo secrets and electron-builder will pick them up automatically.
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: huddle-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          if-no-files-found: ignore
      # Tag pushes publish a Release; hoffle.online links to releases/latest.
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          fail_on_unmatched_files: false
