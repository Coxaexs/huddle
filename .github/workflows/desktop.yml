name: Build desktop apps

# Manually trigger, or on a version tag like `desktop-v1.0.0`.
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write # to publish the GitHub Release the website links to

jobs:
  build:
    strategy:
      # One platform failing should not cancel the others' builds.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # dist:win compiles native/app-audio.cpp (per-app screen-share audio)
      # with Zig before packaging.
      - if: matrix.os == 'windows-latest'
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      # Unsigned builds. To sign/notarize, add CSC_LINK / CSC_KEY_PASSWORD
      # (and APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID for mac)
      # as repo secrets and electron-builder will pick them up automatically.
      # npmRebuild is off in package.json: uiohook-napi (global push-to-talk)
      # ships N-API prebuilds for every platform, and rebuilding it from
      # source needs toolchains the runners lack (distutils, Visual Studio).
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: hoffle-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          if-no-files-found: ignore
      # Tag pushes publish a Release; hoffle.online links to releases/latest.
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          fail_on_unmatched_files: false

  # Lightweight Windows build on WebView2 (desktop-tauri/), attached to the
  # same Release as the Electron installers.
  tauri-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri
      - run: npm install
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: hoffle-lite-windows
          path: desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe

  # Lightweight Mac build on the system WebKit (desktop-tauri/): one universal
  # (Apple silicon + Intel) disk image, attached to the same Release. Unsigned,
  # like the Electron builds; macOS asks you to allow it on first open.
  tauri-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri
      - run: npm install
      - run: npx tauri build --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: hoffle-lite-mac
          path: desktop-tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop-tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # Native apps (desktop-native-*/): no Electron, no Tauri, just the system
  # webview, attached to the same Release. Files carry the desktop version.
  native-windows:
    # Zig cross-compiles the WebView2 app, so a Linux runner is enough.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: bash desktop-native-windows/scripts/build.sh
      - name: Name the file
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          mkdir -p out
          cp desktop-native-windows/build/hoffle_native_windows.zip "out/Hoffle-Native-$v-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: hoffle-native-windows
          path: out/*
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

  native-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ pkg-config libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libkeybinder-3.0-dev libnotify-dev
      - run: bash desktop-native-linux/scripts/build.sh
      - name: Name the file
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          mkdir -p out
          cp desktop-native-linux/build/hoffle_native_linux_x86_64.tar.gz "out/Hoffle-Native-$v-linux-x86_64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: hoffle-native-linux
          path: out/*
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

  # Apple Silicon only. Ad-hoc signed like the Electron builds, so macOS asks
  # to allow it on first open instead of calling it damaged.
  native-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash desktop-native-macos/scripts/build.sh
      - run: codesign --force --deep --sign - desktop-native-macos/build/Hoffle.app
      - run: bash desktop-native-macos/scripts/create-dmg.sh
      - name: Name the file
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          mkdir -p out
          cp desktop-native-macos/build/Hoffle-macOS-arm64.dmg "out/Hoffle-Native-$v-mac-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: hoffle-native-mac
          path: out/*
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
