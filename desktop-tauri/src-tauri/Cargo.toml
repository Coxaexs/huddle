[package]
name = "huddle-desktop"
version = "1.0.0"
description = "Huddle lightweight desktop client powered by Tauri v2"
edition = "2021"
authors = ["coxaexs"]

[lib]
name = "huddle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }
cc = "1.2"

[dependencies]
tauri = { version = "2.6", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-notification = "2.4"
tauri-plugin-shell = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
