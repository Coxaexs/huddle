# Drop-in for huddle.service: give up on a stop after 15 s instead of the
# default 90. Stopping a busy wrangler once took 31 s (2026-10-14), and every
# deploy now stops it. Its databases are SQLite in WAL mode, which survive a
# kill.
#   sudo install -D -m 644 deploy/huddle-service/stop-timeout.conf \
#     /etc/systemd/system/huddle.service.d/stop-timeout.conf
#   sudo systemctl daemon-reload
[Service]
TimeoutStopSec=15
