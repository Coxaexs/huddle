# Drop-in for huddle.service: switch off two wrangler dev extras that the
# newer wrangler turns on by default.
#   X_LOCAL_EXPLORER      the "Local Explorer" at /cdn-cgi/explorer, a UI that
#                         browses the database (only answers local Host headers)
#   X_LOCAL_OBSERVABILITY a trace of every request kept under state/ (~600 MB a day)
#
# Install:
#   sudo install -D -m 644 deploy/huddle-service/local-dev-off.conf \
#     /etc/systemd/system/huddle.service.d/local-dev-off.conf
#   sudo systemctl daemon-reload && sudo systemctl restart huddle
[Service]
Environment=X_LOCAL_EXPLORER=false
Environment=X_LOCAL_OBSERVABILITY=false
