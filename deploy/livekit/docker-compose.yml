services:
  # Huddle's Selective Forwarding Unit. Each client keeps exactly ONE WebRTC
  # connection to this server instead of N-1 mesh connections, which fixes the
  # "I can't hear that one person" failures and, with dynacast/simulcast, uses
  # less bandwidth than the fully TURN-relayed mesh did.
  livekit:
    image: livekit/livekit-server:v1.8.4
    # The image ENTRYPOINT is livekit-server itself, so override it to run the
    # secret injection in a shell first, then exec the server.
    #
    # The whole script must be ONE argument to `sh -c`: with the script split
    # across argv entries, `sh -c` takes only the first as the program and binds
    # the rest to $0/$1/... — which ran a bare `sed` and crash-looped the
    # container.
    #
    # The API secret and TURN credentials come from deploy/livekit/.env
    # (gitignored) and are rendered into a copy under /tmp, so no secrets live in
    # tracked files and the mounted config stays read-only. `$$` defers the
    # expansion to the container's shell instead of compose.
    #
    # The binary lives at /livekit-server and is NOT on PATH, so exec it by
    # absolute path — a bare `livekit-server` exits 127.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        sed -e "s|__LIVEKIT_API_SECRET__|$${LIVEKIT_API_SECRET}|" \
            -e "s|__TURN_USERNAME__|$${TURN_USERNAME}|" \
            -e "s|__TURN_CREDENTIAL__|$${TURN_CREDENTIAL}|" \
            /etc/livekit.yaml > /tmp/livekit.yaml
        exec /livekit-server --config /tmp/livekit.yaml
    restart: unless-stopped
    environment:
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-change-me}"
      TURN_USERNAME: "${TURN_USERNAME:-dcvoice}"
      TURN_CREDENTIAL: "${TURN_CREDENTIAL:-change-me}"
    ports:
      # Signaling + token/health HTTP (TLS is terminated by nginx at
      # wss://xray.deeppixel.online/livekit).
      - "7880:7880"
      # WebRTC over TCP (fallback for networks that block UDP).
      - "7882:7882/tcp"
      # WebRTC media over UDP. The router must forward this range to this host,
      # the same way coturn's 49160-49200 relay range is already forwarded.
      - "7883-7891:7883-7891/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
