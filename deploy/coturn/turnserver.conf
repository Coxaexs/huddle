# ==============================================================================
# Coturn STUN/TURN Configuration for Hoffle
# ==============================================================================
# Coturn relays WebRTC UDP/TCP traffic when direct P2P connections fail due to
# symmetric NAT, carrier-grade NAT (CGNAT) or a corporate firewall.
#
# The one line people get wrong is external-ip. A TURN server behind NAT has to
# be told its public address, because that address is what it hands to every
# peer as the "relay" candidate. If it advertises a private address, or an
# address that used to be yours, clients negotiate happily and then no media
# flows: the symptom is that some friends cannot hear each other while anyone
# on an open network still hears everyone. Run `npm run check:turn` after any
# change here. See docs/self-hosting.md#voice-when-calls-do-not-connect.
# ==============================================================================

# Listening ports for STUN/TURN
listening-port=3478
tls-listening-port=5349

# UDP ports the relay itself uses for media. Each one is forwarded 1:1 by your
# router (see the port list in the self-hosting guide); shrinking this range
# limits how many simultaneous relayed calls fit.
min-port=49152
max-port=49200

# --- the important part -------------------------------------------------------
# <public ip>/<private ip> of this machine. The private part is what the server
# binds to locally; the public part is what peers are told to send media to.
# Replace both. If your ISP hands out a changing address, either keep this line
# in sync (see the guide) or move the relay to a host with a static address.
external-ip=203.0.113.10/192.168.1.198

# --- credentials --------------------------------------------------------------
# Long-term credentials: the same user/password must appear in the TURN URL in
# HUDDLE_ICE_SERVERS. The realm is part of the credential hash, so changing it
# invalidates existing client configuration.
lt-cred-mech
realm=hoffle.local
user=hoffle:secretturnpassword

# --- TLS (needed for turns: URLs on 5349) -------------------------------------
# Point these at a certificate for the name clients connect to. Without them,
# drop the turns: URL from HUDDLE_ICE_SERVERS: browsers fall back to the plain
# turn: entries, which is fine on most networks and useless on 443-only ones.
#cert=/etc/coturn/certs/fullchain.pem
#pkey=/etc/coturn/certs/privkey.pem

# --- housekeeping -------------------------------------------------------------
verbose
fingerprint
no-cli
no-multicast-peers
