# ==============================================================================
# Coturn STUN/TURN Configuration for Hoffle
# ==============================================================================
# Coturn relays WebRTC UDP/TCP traffic when direct P2P connections fail
# due to symmetric NAT, carrier-grade NAT (CGNAT), or corporate firewalls.
# ==============================================================================

# Listening ports for STUN/TURN
listening-port=3478
tls-listening-port=5349

# Min and max ports for UDP relay traffic
min-port=49152
max-port=49200

# Logging
verbose
fingerprint
lt-cred-mech

# Realm and credentials (match HUDDLE_ICE_SERVERS in .dev.vars)
realm=hoffle.local
user=hoffle:secretturnpassword

# Security settings
no-cli
no-tls
no-dtls
