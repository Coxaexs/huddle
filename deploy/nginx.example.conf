# ==============================================================================
# Hoffle Nginx Reverse Proxy Configuration Example
#
# Supports:
# 1. Backward-compatible subpath: https://deeppixel.online/hangout/
# 2. Modern app subdomain:        https://chat.hoffle.online/
# 3. Modern landing page:         https://hoffle.online/
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Subdomain configuration: chat.hoffle.online (Hoffle Web App)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name chat.hoffle.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.hoffle.online;

    # SSL Certificates (managed via certbot or manual)
    # ssl_certificate /etc/letsencrypt/live/hoffle.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/hoffle.online/privkey.pem;

    client_max_body_size 45M;

    # WebSocket & Realtime Upgrades
    location /api/realtime {
        proxy_pass http://127.0.0.1:8730;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Main Application
    location / {
        proxy_pass http://127.0.0.1:8730;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 2. Apex domain configuration: hoffle.online (Landing Page / Self-Host Docs)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name hoffle.online www.hoffle.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hoffle.online www.hoffle.online;

    # ssl_certificate /etc/letsencrypt/live/hoffle.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/hoffle.online/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8730;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

